name: Build on Unix
description: Build a target on Linux or macOS.
inputs:
  target:
    description: Make target to run.
    required: true
  make_args:
    description: Additional arguments to pass to make.
    default: ""
  run_prefix:
    description: Command prefix for running the engine during profile builds.
    default: ""
  cxxflags:
    description: C++ compiler flags.
    default: ""
  ldflags:
    description: Linker flags.
    default: ""
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      working-directory: engine
      env:
        MAKE_ARGS: ${{ inputs.make_args }}
        MAKE_TARGET: ${{ inputs.target }}
        RUN_PREFIX: ${{ inputs.run_prefix }}
        CXXFLAGS: ${{ inputs.cxxflags }}
        LDFLAGS: ${{ inputs.ldflags }}
      run: |
        make clean
        make_args=()
        read -r -a make_args <<< "$MAKE_ARGS"
        make_command=(make -j4 "${make_args[@]}" "$MAKE_TARGET")
        if [[ -n "$CXXFLAGS" ]]; then
          make_command+=("CXXFLAGS=$CXXFLAGS")
        fi
        if [[ -n "$LDFLAGS" ]]; then
          make_command+=("LDFLAGS=$LDFLAGS")
        fi
        if [[ -n "$RUN_PREFIX" ]]; then
          make_command+=("RUN_PREFIX=$RUN_PREFIX")
        fi
        "${make_command[@]}"
