---
name: Set up build environment
description: Install build dependencies and check toolchain commands.
inputs:
  compiler:
    description: C++ compiler command.
    required: true
  shell:
    description: Shell used by the calling matrix job.
    required: true
  ci_toolchain:
    description: Install the supported Linux or macOS CI toolchain.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: inputs.ci_toolchain == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          build-essential clang-20 expect libcurl4-openssl-dev
        curl -fsSL https://mirrors.kernel.org/gnu/make/make-4.4.1.tar.gz \
          | tar -xz -C /tmp
        cd /tmp/make-4.4.1
        ./configure --prefix=/usr/local
        make -j"$(nproc)"
        sudo make install
        cd /
        rm -rf /tmp/make-4.4.1

    - name: Install macOS build tools
      if: inputs.ci_toolchain == 'true' && runner.os == 'macOS'
      shell: ${{ inputs.shell }}
      run: |
        brew install expect llvm@20 make
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
        echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

    - name: Set up uv
      if: inputs.ci_toolchain == 'true'
      uses: astral-sh/setup-uv@v6

    - name: Check CI build tools
      if: inputs.ci_toolchain == 'true'
      shell: ${{ inputs.shell }}
      env:
        RUKH_CXX: ${{ inputs.compiler }}
      run: |
        cmake --version
        make --version
        uv --version
        "$RUKH_CXX" --version
        git --version

    - name: Check compiler
      if: inputs.ci_toolchain != 'true'
      shell: ${{ inputs.shell }}
      env:
        RUKH_CXX: ${{ inputs.compiler }}
      run: |
        "$RUKH_CXX" --version
        git --version
