---
name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci__test:
    name: ci__${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            compiler: clang++-20
          - name: macos-arm64
            os: xcode-27
            compiler: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/build-setup
        with:
          compiler: ${{ matrix.compiler }}
          shell: bash
          ci_toolchain: 'true'

      - name: Extract benchmark reference
        id: benchref
        shell: bash
        run: |
          benchref=$(git log -100 --format=%B \
            | grep -m1 -E \
              '^[[:space:]]*[Bb]ench[ :]+[1-9][0-9]{5,7}[[:space:]]*$' \
            | tr -cd '0-9' || true)
          echo "value=$benchref" >> "$GITHUB_OUTPUT"

      - name: Build and test
        shell: bash
        env:
          RUKH_CXX: ${{ matrix.compiler }}
        run: |
          cmake_configure_args="-DCMAKE_CXX_COMPILER=$RUKH_CXX"
          if [[ -n "${SDKROOT:-}" ]]; then
            cmake_configure_args+=" -DCMAKE_OSX_SYSROOT=$SDKROOT"
          fi
          make rukh.test RUKH_PROFILE=release \
            RUKH_CMAKE_CONFIGURE_ARGS="$cmake_configure_args"

      - name: Run engine regression checks
        shell: bash
        env:
          BENCHMARK_REFERENCE: ${{ steps.benchref.outputs.value }}
        run: |
          engine_binary="$GITHUB_WORKSPACE/_build/engine/release/rukh"
          ln -s "$engine_binary" "$GITHUB_WORKSPACE/engine/stockfish"
          ln -s "$engine_binary" "$GITHUB_WORKSPACE/engine/shashchess"
          cd "$GITHUB_WORKSPACE/engine"
          if [[ -n "$BENCHMARK_REFERENCE" ]]; then
            ../tests/signature.sh "$BENCHMARK_REFERENCE"
          else
            ../tests/signature.sh
          fi
          ../tests/perft.sh
