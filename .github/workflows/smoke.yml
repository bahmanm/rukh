---
name: smoke

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke__games:
    name: smoke__games
    runs-on: ubuntu-22.04

    env:
      ENGINE: ${{ github.workspace }}/engine/shashchess

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/build-setup
        with:
          compiler: g++
          shell: bash

      - name: Build debug engine
        uses: ./.github/actions/build
        with:
          target: build
          make_args: debug=yes

      - name: Check out fastchess
        uses: actions/checkout@v4
        with:
          repository: Disservin/fastchess
          path: fastchess
          ref: 894616028492ae6114835195f14a899f6fa237d3
          persist-credentials: false

      - name: Build fastchess
        working-directory: fastchess
        run: make -j

      - name: Run games
        working-directory: fastchess
        run: |
          ./fastchess -rounds 4 -games 2 -repeat -concurrency 4 -openings file=app/tests/data/openings.epd format=epd order=random -srand $RANDOM\
               -engine name=sf1 cmd="$ENGINE"\
               -engine name=sf2 cmd="$ENGINE"\
               -ratinginterval 1 -report penta=true -each proto=uci tc=4+0.04 -log file=fast.log | tee fast.out
          cat fast.log
          ! grep "Assertion" fast.log > /dev/null
          ! grep "disconnect" fast.out > /dev/null

  smoke__matetrack:
    name: smoke__matetrack
    runs-on: ubuntu-22.04

    env:
      ENGINE: ${{ github.workspace }}/engine/shashchess

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/build-setup
        with:
          compiler: g++
          shell: bash

      - name: Build engine
        uses: ./.github/actions/build
        with:
          target: profile-build

      - name: Check out Matetrack
        uses: actions/checkout@v4
        with:
          repository: vondele/matetrack
          path: matetrack
          ref: 4f8a80860ed8f3607f05a9195df8b40203bdc360
          persist-credentials: false

      - name: Install Matetrack dependencies
        working-directory: matetrack
        run: pip install -r requirements.txt

      - name: Cache Syzygy tablebases
        id: cache-syzygy
        uses: actions/cache@v4
        with:
          path: |
            matetrack/3-4-5-wdl/
            matetrack/3-4-5-dtz/
          key: key-syzygy

      - name: Download Syzygy tablebases
        working-directory: matetrack
        if: steps.cache-syzygy.outputs.cache-hit != 'true'
        run: |
          wget --no-verbose -r -nH --cut-dirs=2 --no-parent --reject="index.html*" -e robots=off https://tablebase.lichess.ovh/tables/standard/3-4-5-wdl/
          wget --no-verbose -r -nH --cut-dirs=2 --no-parent --reject="index.html*" -e robots=off https://tablebase.lichess.ovh/tables/standard/3-4-5-dtz/

      - name: Run Matetrack single-threaded
        working-directory: matetrack
        run: |
          python matecheck.py --syzygyPath 3-4-5-wdl/:3-4-5-dtz/ --engine "$ENGINE" --epdFile mates2000.epd --nodes 100000 | tee matecheckout1.out
          ! grep "issues were detected" matecheckout1.out > /dev/null

      - name: Run Matetrack multi-threaded
        working-directory: matetrack
        run: |
          python matecheck.py --syzygyPath 3-4-5-wdl/:3-4-5-dtz/ --engine "$ENGINE" --epdFile mates2000.epd --nodes 100000 --threads 4 | tee matecheckout4.out
          ! grep "issues were detected" matecheckout4.out > /dev/null

      - name: Run cursed positions single-threaded
        working-directory: matetrack
        run: |
          grep 5men cursed.epd > cursed5.epd
          python matecheck.py --syzygyPath 3-4-5-wdl/:3-4-5-dtz/ --engine "$ENGINE" --epdFile cursed5.epd --nodes 100000 --syzygy50MoveRule false | tee matecheckcursed1.out
          ! grep "issues were detected" matecheckcursed1.out > /dev/null

      - name: Run cursed positions multi-threaded
        working-directory: matetrack
        run: |
          grep 5men cursed.epd > cursed5.epd
          python matecheck.py --syzygyPath 3-4-5-wdl/:3-4-5-dtz/ --engine "$ENGINE" --epdFile cursed5.epd --nodes 100000 --threads 4 --syzygy50MoveRule false | tee matecheckcursed4.out
          ! grep "issues were detected" matecheckcursed4.out > /dev/null

      - name: Verify cursed position results
        working-directory: matetrack
        run: |
          mates=$(grep "Found mates:" matecheckcursed1.out | awk '{print $3}')
          tbwins=$(grep "Found TB wins:" matecheckcursed1.out | awk '{print $4}')
          if [ $(($mates + $tbwins)) -ne 32 ]; then
            echo "Sum of mates and TB wins is not 32 in matecheckcursed1.out" >&2
            exit 1
          fi
          mates=$(grep "Found mates:" matecheckcursed4.out | awk '{print $3}')
          tbwins=$(grep "Found TB wins:" matecheckcursed4.out | awk '{print $4}')
          if [ $(($mates + $tbwins)) -ne 32 ]; then
            echo "Sum of mates and TB wins is not 32 in matecheckcursed4.out" >&2
            exit 1
          fi
