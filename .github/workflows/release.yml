name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release-build:
    name: release/build
    uses: ./.github/workflows/release-build.yml
  release-package:
    name: release/package
    needs: [release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: build-artifacts
      - name: Create release packages
        run: |
          mkdir -p release-assets
          for artifact_dir in build-artifacts/*; do
            binary=$(find "$artifact_dir" -maxdepth 1 -type f -name 'rukh-*' -print -quit)
            if [[ -z "$binary" ]]; then
              echo "No Rukh binary found in $artifact_dir" >&2
              exit 1
            fi

            binary_name=$(basename "$binary")
            package_name=${binary_name%.exe}
            package_dir=$(mktemp -d)
            mkdir "$package_dir/rukh"
            cp -R "$artifact_dir/src" "$artifact_dir/scripts" "$package_dir/rukh/"
            cp "$binary" "$package_dir/rukh/"
            cp "$artifact_dir/Copying.txt" "$artifact_dir/AUTHORS" "$artifact_dir/CITATION.cff" "$artifact_dir/README.md" "$artifact_dir/CONTRIBUTING.md" "$package_dir/rukh/"

            if [[ "$binary_name" == *.exe ]]; then
              (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/release-assets/$package_name.zip" rukh)
            else
              tar -cf "$GITHUB_WORKSPACE/release-assets/$package_name.tar" -C "$package_dir" rukh
            fi
            rm -rf "$package_dir"
          done
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: rukh-release-packages
          path: release-assets/*
          if-no-files-found: error
  release-publish-github:
    name: release/publish-github
    needs: [release-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: rukh-release-packages
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
