name: qc
on:
  push:
    tags:
      - "*"
    branches:
      - main
      - tools
      - github_ci
  pull_request:
    branches:
      - main
      - tools
jobs:
  qc__sanitisers:
    name: qc__${{ matrix.sanitisers.label }}
    runs-on: ${{ matrix.config.os }}
    env:
      COMPCXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      CXXFLAGS: "-Werror"
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Ubuntu 22.04 GCC
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            shell: bash
        sanitisers:
          - label: thread-sanitizer
            name: Run with thread sanitizer
            make_option: sanitize=thread
            cxx_extra_flags: ""
            instrumented_option: sanitizer-thread
          - label: undefined-sanitizer
            name: Run with UB sanitizer
            make_option: sanitize=undefined
            cxx_extra_flags: ""
            instrumented_option: sanitizer-undefined
          - label: valgrind
            name: Run under Valgrind
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: valgrind
          - label: valgrind-thread
            name: Run under Valgrind with threads
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: valgrind-thread
          - label: non-instrumented
            name: Run without instrumentation
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: none
          - label: glibcxx-assertions
            name: Run with GLIBCXX assertions
            make_option: ""
            cxx_extra_flags: -D_GLIBCXX_ASSERTIONS
            instrumented_option: non
    defaults:
      run:
        working-directory: engine
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install required Linux packages
        run: |
          sudo apt update
          sudo apt install expect valgrind

      - name: Set up build environment
        uses: ./.github/actions/build-setup
        with:
          compiler: ${{ matrix.config.compiler }}
          shell: ${{ matrix.config.shell }}

      - name: Reduce ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build engine
        uses: ./.github/actions/build
        with:
          target: build
          make_args: ARCH=x86-64-sse41-popcnt ${{ matrix.sanitisers.make_option }} debug=yes optimize=no
          cxxflags: -O1 -f-no-inline ${{ matrix.sanitisers.cxx_extra_flags }}

      - name: ${{ matrix.sanitisers.name }}
        working-directory: engine
        shell: ${{ matrix.config.shell }}
        run: python3 ../tests/instrumented.py --${{ matrix.sanitisers.instrumented_option }} ./shashchess
