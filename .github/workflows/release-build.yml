---
name: release/build

on:
  workflow_call:

jobs:
  release-build__matrix:
    name: release-build__matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: set-matrix
        name: Set up build matrix
        run: echo "matrix=$(jq -c . .github/workflows/release-build-matrix.json)" >> "$GITHUB_OUTPUT"

  release-build__build:
    needs: [release-build__matrix]
    name: release-build__${{ matrix.config.simple_name }}-${{ matrix.binaries }}
    runs-on: ${{ matrix.config.os }}

    env:
      COMPCXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      EXT: ${{ matrix.config.ext }}
      NAME: ${{ matrix.config.simple_name }}
      BINARY: ${{ matrix.binaries }}
      SDE: ${{ matrix.config.sde }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Matrix.outputs.matrix) }}

    defaults:
      run:
        working-directory: engine
        shell: ${{ matrix.config.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up GCC on Linux
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-gcc@eaa888eb19115a521fa72b65cd94fe1f25bbcaac
        with:
          version: 11

      - name: Set up MSYS2 and install required packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msys_sys }}
          install: mingw-w64-${{ matrix.config.msys_env }} make git zip

      - name: Download SDE package
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: petarpetrovt/setup-sde@f0fa5971dc275704531e94264dd23250c442aa41
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.33.0

      - name: Set up build environment
        uses: ./.github/actions/build-setup
        with:
          compiler: ${{ matrix.config.compiler }}
          shell: ${{ matrix.config.shell }}

      - name: Show compiler CPU information
        run: |
          if [[ "$COMPCXX" == clang* ]]; then
             $COMPCXX -E - -march=native -###
          else
            $COMPCXX -Q -march=native --help=target
          fi

      - name: Build ${{ matrix.binaries }}
        uses: ./.github/actions/build
        with:
          target: profile-build
          make_args: ARCH=${{ matrix.binaries }} COMP=${{ matrix.config.comp }}
          run_prefix: ${{ matrix.config.sde }}

      - name: Strip binary
        run: make strip ARCH=$BINARY COMP=$COMP

      - name: Check binary signature
        run: RUN_PREFIX="$SDE" ../tests/signature.sh $benchref

      - name: Name binary
        run: mv ./shashchess$EXT ../rukh-$NAME-$BINARY$EXT

      - name: Remove files outside source package
        run: git clean -fx

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.simple_name }} ${{ matrix.binaries }}
          path: |
            .
            !.git
            !.output
